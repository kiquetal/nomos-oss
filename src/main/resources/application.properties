# =============================================================================
# Nomos - Centralized Rule Management for API Proxy Access Control
# =============================================================================

# --- Application ---
quarkus.application.name=nomos
quarkus.application.version=1.0.0

# --- HTTP ---
quarkus.http.port=8080
quarkus.http.root-path=/nomos
quarkus.shutdown.timeout=30s

# --- Neo4j ---
# Dev Services: auto-starts a Neo4j container in dev/test mode
quarkus.neo4j.devservices.enabled=true
quarkus.neo4j.devservices.image-name=neo4j:5
quarkus.neo4j.devservices.bolt-port=7687

# Production Neo4j configuration (override with env vars)
%prod.quarkus.neo4j.uri=${NEO4J_URI:bolt://localhost:7687}
%prod.quarkus.neo4j.authentication.username=${NEO4J_USER:neo4j}
%prod.quarkus.neo4j.authentication.password=${NEO4J_PASSWORD:neo4j}
%prod.quarkus.neo4j.pool.max-connection-pool-size=50
%prod.quarkus.neo4j.pool.connection-acquisition-timeout=60s

# --- OpenAPI / Swagger UI ---
quarkus.smallrye-openapi.info-title=Nomos
quarkus.smallrye-openapi.info-version=1.0.0
quarkus.smallrye-openapi.info-description=Centralized rule management for API proxy access and JWT claim validation
quarkus.smallrye-openapi.info-contact-name=Edge Team
quarkus.swagger-ui.always-include=true

# --- Health ---
quarkus.smallrye-health.ui.always-include=true

# --- Metrics (Prometheus) ---
quarkus.micrometer.export.prometheus.path=/metrics

# --- Logging ---
quarkus.log.level=INFO
quarkus.log.category."me.cresterida".level=DEBUG
%prod.quarkus.log.console.format=%d{yyyy-MM-dd HH:mm:ss,SSS} %-5p [%c{3.}] (%t) %s%e%n

# --- Kubernetes ---
quarkus.kubernetes.name=nomos
quarkus.kubernetes.namespace=default
quarkus.kubernetes.replicas=2
quarkus.kubernetes.image-pull-policy=if-not-present
quarkus.kubernetes.liveness-probe.http-action-path=/q/health/live
quarkus.kubernetes.readiness-probe.http-action-path=/q/health/ready
quarkus.kubernetes.startup-probe.http-action-path=/q/health/started
quarkus.kubernetes.resources.requests.cpu=100m
quarkus.kubernetes.resources.requests.memory=128Mi
quarkus.kubernetes.resources.limits.cpu=500m
quarkus.kubernetes.resources.limits.memory=256Mi
quarkus.kubernetes.env.vars.NEO4J_URI=bolt://neo4j:7687

# Prometheus scrape annotations (Istio mTLS-compatible via metrics merging)
# Envoy merges app metrics into its own /stats/prometheus endpoint on port 15020
# Prometheus scrapes Envoy (mTLS), Envoy fetches app metrics locally (plaintext)
quarkus.kubernetes.annotations."prometheus.istio.io/merge-metrics"=true
quarkus.kubernetes.annotations."prometheus.istio.io/path"=/nomos/q/metrics
quarkus.kubernetes.annotations."prometheus.istio.io/port"=8080

# --- Container Image ---
quarkus.container-image.group=me.cresterida
quarkus.container-image.name=nomos-oss
quarkus.container-image.tag=${quarkus.application.version}
